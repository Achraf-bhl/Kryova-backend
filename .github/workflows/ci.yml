name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.12, not 3.11: numpy's stubs use PEP 695 syntax that mypy rejects
          # under an older target. Keep in step with pyproject's python_version.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app tests
      - run: pytest -q
        env:
          # A placeholder, deliberately not a secret: nothing in the suite
          # connects to it. Settings validation requires a PostgreSQL URL, and
          # the tests run against TEST_DATABASE_URL -- left unset here, so
          # conftest builds an in-memory SQLite database instead. Pointing this
          # at a real database would put CI one bug away from dropping a schema
          # in production.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kryova_ci
          SECRET_KEY: ci-only-secret-key-not-used-in-production
