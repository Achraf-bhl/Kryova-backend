[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "E501"]

[tool.mypy]
# 3.12, not 3.11: numpy's bundled stubs use PEP 695 `type X = ...` syntax, which
# mypy rejects outright when told to assume 3.11 -- it aborts before checking any
# of our own code. Keep this in step with the CI matrix in .github/workflows.
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# The CATIA bridge daemon (`scripts/catia_bridge/`) is a standalone package that
# ships to a Windows workstation, so it is not importable from `app/`. It is on
# the path here because the test suite drives the real daemon code and it should
# be type-checked like everything else.
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = [
  # `anthropic` is an OPTIONAL dependency -- only AI_PROVIDER=anthropic needs
  # it, so it is absent from requirements.txt and from a default install.
  # Both forms are needed: the bare name for `import anthropic`, the wildcard
  # for its submodules.
  "anthropic",
  "anthropic.*",
  # `pdfminer.six` is the last-resort PDF extractor in app/retrieval/extract.py
  # and is deliberately absent from requirements: poppler and pypdf cover the
  # corpus, and pdfminer is an order of magnitude slower. The import is guarded
  # and falls through when it is missing.
  "pdfminer",
  "pdfminer.*",
  "bcrypt.*",
  # pywin32, which `app/catia/bridge.py` imports to drive CATIA over COM. It is
  # installed only on Windows (see the marker in requirements.txt), so CI --
  # which runs on ubuntu -- has neither the package nor its stubs. Listing it
  # here rather than adding `types-pywin32` to requirements-dev keeps the
  # Windows install from carrying stubs that shadow the real package.
  "pythoncom",
  "win32com",
  "win32com.*",
  "gmsh.*",
  "faiss.*",
  "jose.*",
  "scipy.*",
  "OCP",
  "OCP.*",
]
ignore_missing_imports = true

# OCP (`cadquery-ocp`) is the OCCT geometry kernel binding behind `app/kernel/`. It is
# pybind11-generated and ships no `py.typed` marker, so every one of its ~320 modules
# raises `import-untyped` -- and that error is reported against the *importing* file,
# which is why this override targets our module rather than OCP. Suppressing it here
# and nowhere else is exactly why `app/kernel/occt.py` exists as the single place OCP
# may be imported: the untyped surface is contained in one file instead of spreading
# across the package, and `occ()` hands the rest of the kernel plain `Any`.
[[tool.mypy.overrides]]
module = ["app.kernel.occt"]
disable_error_code = ["import-untyped"]
